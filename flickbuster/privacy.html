<h1>フリックバスター 隱私權政策</h1>
<p>最後更新：2026 年 10 月 16 日</p>
<p>「フリックバスター－日文五十音滑動打字」（以下稱「本 App」）不蒐集、不儲存、也不傳送任何個人資料。</p>
<ul>
  <li>本 App 不需要註冊或登入。</li>
  <li>本 App 不使用任何分析、追蹤或廣告工具，也不會連上網路。</li>
  <li>你的遊戲進度（星數、最高分、各假名的練習紀錄）只儲存在你自己的裝置上；刪除 App 時會一併刪除。</li>
</ul>
<p>如果這份政策有變更，會更新在這個頁面。</p>
